name: Build & Deploy DrianStore (Web & APK)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🛑 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.6'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: 🌐 Build Flutter Web
        run: |
          cd frontend
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: 🤖 Build Android APK
        run: |
          cd frontend
          flutter build apk --release

      - name: 🚀 Deploy Web to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build/web

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drianstore-android-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk

      - name: 🏷️ Create GitHub Release & Attach APK (Optional Tagged Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: frontend/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
